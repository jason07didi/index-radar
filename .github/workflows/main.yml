name: Update Index Market Data

on:
  # 允许手动运行
  workflow_dispatch:

  # 自动运行
  # GitHub Actions cron 使用 UTC 时间
  #
  # 01:00-03:59 UTC  → 中国上午交易时段附近
  # 05:00-07:59 UTC  → 中国下午交易时段附近
  # 13:00-21:59 UTC  → 覆盖美股夏令时/冬令时交易窗口
  #
  # 每15分钟执行一次，仅周一至周五
  schedule:
    - cron: "*/15 1-3,5-7,13-21 * * 1-5"


# 允许 Action 自动修改 market.json
permissions:
  contents: write


# 防止上一次尚未结束时又启动下一次
concurrency:
  group: index-market-update
  cancel-in-progress: true


jobs:

  update-market:

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # 1. 获取仓库
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Python环境
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ==========================================
      # 3. 安装依赖
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests


      # ==========================================
      # 4. 获取行情并计算指标
      # ==========================================

      - name: Update market data
        run: |
          python scripts/update_market.py


      # ==========================================
      # 5. 自动提交新的 market.json
      # ==========================================

      - name: Commit updated market data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market.json


          if git diff --cached --quiet; then

            echo "Market data has not changed."

          else

            git commit -m "Auto update market data"

            git push

          fi
