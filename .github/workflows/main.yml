name: Update Index Market Data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 1-3,5-7,13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: index-market-update
  cancel-in-progress: true

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Update market and valuation data
        run: |
          python scripts/update_market.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market.json data/valuation_history.json

          if git diff --cached --quiet; then
            echo "Market and valuation data have not changed."
          else
            git commit -m "Auto update market and valuation data"
            git push
          fi
